framework:
  messenger:
    # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
    # failure_transport: failed

    transports:
      # https://symfony.com/doc/current/messenger.html#transport-configuration
      # async: '%env(MESSENGER_TRANSPORT_DSN)%'
      # failed: 'doctrine://default?queue_name=failed'
      # sync: 'sync://'
      doctrine:
        dsn: "%env(MESSENGER_DOCTRINE_TRANSPORT_DSN)%"
      contract_created:
        dsn: "%env(MESSENGER_AMQP_TRANSPORT_DSN)%"
        options:
            exchange:
                name: 'old_sound_rabbit_mq.contract_created'
                type: direct
        serializer: 'messenger.transport.symfony_serializer'
      notify_person:
        dsn: "%env(MESSENGER_AMQP_TRANSPORT_DSN)%"
        options:
            exchange:
                name: 'old_sound_rabbit_mq.notify_person'
                type: direct
        serializer: 'messenger.transport.symfony_serializer'
      sync: 'sync://'

    routing:
      'App\Core\Ampq\Event\ContractCreatedEvent': contract_created
      'App\Core\Ampq\Event\NotifyPersonCommand': notify_person

